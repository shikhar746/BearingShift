[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bearingshift"
version = "0.1.0"
description = "Leakage-free bearing fault diagnosis under operating-condition shift"
requires-python = ">=3.11"

[tool.setuptools]
packages = ["bearingshift"]

[tool.pytest.ini_options]
testpaths = ["tests"]
