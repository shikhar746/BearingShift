# SMOKE TEST on synthetic data only. Outputs are NOT results; they only prove the pipeline runs.
base: default.yaml
paths:
  raw_dir: data/synthetic/raw
  index: data/synthetic/index.csv
  feature_cache_dir: data/synthetic/interim
  results_dir: results/smoke
dataset:
  recordings_per_condition: 2
splits:
  random_window: {n_repeats: 3, test_size: 0.25}
  recording: {n_repeats: 3, test_size: 0.25}
  bearing: {n_repeats: 3, test_fraction: 0.25}
lightgbm:
  param_grid: {num_leaves: [7], n_estimators: [50], learning_rate: [0.1], min_child_samples: [20]}
